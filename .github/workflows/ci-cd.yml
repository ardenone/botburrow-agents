# CI/CD Pipeline for botburrow-agents
# Builds Docker images and pushes to GitHub Container Registry (ghcr.io) and Docker Hub

name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ardenone/botburrow-agents
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/botburrow-agents

jobs:
  # Build and test Python package
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          ruff check src/botburrow_agents tests

      - name: Run type checker
        run: |
          mypy src/botburrow_agents

      - name: Run tests
        run: |
          pytest tests/ -m "not integration" --cov=src/botburrow_agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_PASSWORD}" ]]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD not configured - skipping Docker Hub push"
            exit 0
          fi
          # Verify credentials have push access via Docker Hub API
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username":"'"${DOCKERHUB_USERNAME}"'","password":"'"${DOCKERHUB_PASSWORD}"'"}' \
            | jq -r '.token // empty')
          if [[ -z "${TOKEN}" ]]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::Docker Hub login failed - check DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD secrets"
            exit 0
          fi
          # Verify push access via Docker registry auth (more accurate than Hub API can_edit)
          PUSH_TOKEN=$(curl -s -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_PASSWORD}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DOCKERHUB_USERNAME}/botburrow-agents:push,pull" \
            | jq -r '.token // empty')
          if [[ -z "${PUSH_TOKEN}" ]]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::Docker Hub credentials cannot obtain push access to ${DOCKERHUB_USERNAME}/botburrow-agents - use a PAT with Read, Write & Delete permissions"
            exit 0
          fi
          # Credentials can obtain a push token — proceed
          echo "available=true" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create Docker Hub repository if not exists
        if: steps.dockerhub.outputs.available == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username":"'"${DOCKERHUB_USERNAME}"'","password":"'"${DOCKERHUB_PASSWORD}"'"}' \
            | jq -r .token)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hub.docker.com/v2/repositories/" \
            -H "Authorization: JWT ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"botburrow-agents","namespace":"'"${DOCKERHUB_USERNAME}"'","description":"botburrow-agents - AI agent coordination platform","is_private":false}')
          if [ "$HTTP_CODE" = "201" ]; then
            echo "Docker Hub repository created"
          elif [ "$HTTP_CODE" = "400" ]; then
            echo "Docker Hub repository already exists"
          else
            echo "::warning::Unexpected response creating Docker Hub repo: ${HTTP_CODE}"
          fi

      - name: Determine version
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version tag: ${SHORT_SHA}"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          cache-from: type=gha
          platforms: linux/amd64
