# CI/CD Pipeline for botburrow-agents
# Builds Docker images and pushes to GitHub Container Registry (ghcr.io) and Docker Hub

name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ardenone/botburrow-agents
  DOCKERHUB_IMAGE_NAME: ardenone/botburrow-agents

jobs:
  # Build and test Python package
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          ruff check src/botburrow_agents tests

      - name: Run type checker
        run: |
          mypy src/botburrow_agents

      - name: Run tests
        run: |
          pytest tests/ -m "not integration" --cov=src/botburrow_agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -z "${DOCKERHUB_PASSWORD}" ]]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::DOCKERHUB_PASSWORD not configured - skipping Docker Hub push"
            exit 0
          fi
          # Login to Docker Hub
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username":"ardenone","password":"'"${DOCKERHUB_PASSWORD}"'"}' \
            | jq -r '.token // empty')
          if [[ -z "${TOKEN}" ]]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::Docker Hub login failed for ardenone - check DOCKERHUB_PASSWORD secret"
            exit 0
          fi
          # Ensure the repository exists before verifying registry push scope.
          # The registry may not grant push scope for a non-existent repository,
          # so we create it first via the Docker Hub API.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hub.docker.com/v2/repositories/" \
            -H "Authorization: JWT ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"botburrow-agents","namespace":"ardenone","description":"botburrow-agents - AI agent coordination platform","is_private":false}')
          if [ "$HTTP_CODE" = "201" ]; then
            echo "Docker Hub repository ardenone/botburrow-agents created"
          elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
            echo "Docker Hub repository ardenone/botburrow-agents already exists"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::Failed to ensure Docker Hub repository exists: HTTP ${HTTP_CODE}"
            exit 0
          fi
          # Obtain push token from Docker registry auth with retries.
          # A newly-created repository may need a few seconds to propagate
          # before Docker Hub's auth service grants push scope.
          PUSH_GRANTED=false
          for attempt in 1 2 3; do
            PUSH_TOKEN=$(curl -s -u "ardenone:${DOCKERHUB_PASSWORD}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ardenone/botburrow-agents:push,pull" \
              | jq -r '.token // empty')
            if [[ -z "${PUSH_TOKEN}" ]]; then
              echo "Attempt ${attempt}: Docker Hub registry auth returned no token"
              [ $attempt -lt 3 ] && sleep 5
              continue
            fi
            # Decode the JWT payload and verify push scope was actually granted.
            # A read-only PAT returns a token but with pull-only access; checking
            # only for a non-empty token produces a false positive.
            ENCODED=$(echo "${PUSH_TOKEN}" | cut -d. -f2 | tr -- '-_' '+/')
            case $(( ${#ENCODED} % 4 )) in
              2) ENCODED="${ENCODED}==" ;;
              3) ENCODED="${ENCODED}=" ;;
            esac
            GRANTED=$(echo "${ENCODED}" | base64 -d 2>/dev/null | jq -r '.access[]? | select(.type=="repository") | .actions[]?' 2>/dev/null || true)
            if echo "${GRANTED}" | grep -q "^push$"; then
              PUSH_GRANTED=true
              break
            fi
            echo "Attempt ${attempt}: push scope not yet granted (got: $(echo "${GRANTED}" | tr '\n' ','))"
            [ $attempt -lt 3 ] && sleep 5
          done
          if ! $PUSH_GRANTED; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::error::Docker Hub credentials do not have push access to ardenone/botburrow-agents - use a PAT with Read & Write permissions"
            exit 0
          fi
          # Credentials have verified push access — proceed
          echo "available=true" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ardenone
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version tag: ${SHORT_SHA}"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          cache-from: type=gha
          platforms: linux/amd64
