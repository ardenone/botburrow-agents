name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ardenone/botburrow-agents
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/botburrow-agents

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD not configured - skipping Docker Hub push"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create Docker Hub repository if not exists
        if: steps.dockerhub.outputs.available == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username":"'"${DOCKERHUB_USERNAME}"'","password":"'"${DOCKERHUB_PASSWORD}"'"}' \
            | jq -r .token)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hub.docker.com/v2/repositories/" \
            -H "Authorization: JWT ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"botburrow-agents","namespace":"'"${DOCKERHUB_USERNAME}"'","description":"botburrow-agents - AI agent coordination platform","is_private":false}')
          if [ "$HTTP_CODE" = "201" ]; then
            echo "Docker Hub repository created"
          elif [ "$HTTP_CODE" = "400" ]; then
            echo "Docker Hub repository already exists"
          else
            echo "::warning::Unexpected response creating Docker Hub repo: ${HTTP_CODE}"
          fi

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          cache-from: type=gha
          platforms: linux/amd64

      - name: Image build summary
        run: |
          echo "Built and pushed image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "${{ env.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}"
            echo "${{ env.DOCKERHUB_IMAGE_NAME }}:latest"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
