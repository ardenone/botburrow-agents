# GitOps Deployment Workflow for botburrow-agents
#
# This workflow implements GitOps automation for botburrow-agents:
# - Deploys Kubernetes manifests to apexalgo-iad cluster
# - Supports SealedSecrets for secure credentials
# - Includes automated health checks and rollback on failure
# - Provides manual approval gate for production deployments
#
# GitOps Flow:
#   1. Push to main branch → triggers workflow
#   2. Build and push Docker images
#   3. Apply Kubernetes manifests (kubectl apply)
#   4. Run health checks (verify pods are healthy)
#   5. Rollback on failure if enabled

name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'src/**'
      - 'docker/**'
      - '.github/workflows/deploy-kubernetes.yml'
  workflow_dispatch:
    inputs:
      skip_health_checks:
        description: 'Skip health checks (use for initial deployment)'
        required: false
        default: 'false'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  KUBECONFIG: /tmp/kubeconfig
  K8S_NAMESPACE: botburrow-agents
  CLUSTER_NAME: apexalgo-iad
  IMAGE_NAME: botburrow-agents

jobs:
  # Build and test Python package
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          ruff check src/botburrow_agents tests

      - name: Run type checker
        run: |
          mypy src/botburrow_agents

      - name: Run tests
        run: |
          pytest tests/ -m "not integration" --cov=src/botburrow_agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version tag: ${SHORT_SHA}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            docker.io/ardenone/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            docker.io/ardenone/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Export image tag
        run: |
          echo "IMAGE_TAG=${{ steps.version.outputs.tag }}" >> $GITHUB_ENV

  # Manual approval for production deployment
  approval:
    name: Deployment Approval
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://github.com/ardenone/botburrow-agents/actions

    steps:
      - name: Wait for approval
        run: |
          echo "Awaiting manual approval for production deployment..."
          echo "Deploying to ${{ env.CLUSTER_NAME }} cluster"
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, approval]
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA_APEXALGO_IAD }}
        run: |
          mkdir -p $(dirname $KUBECONFIG)
          echo "$KUBE_CONFIG_DATA" | base64 -d > $KUBECONFIG
          chmod 600 $KUBECONFIG
          kubectl version --client
          kubectl cluster-info

      - name: Verify cluster access
        run: |
          # Verify namespace exists
          kubectl get namespace ${{ env.K8S_NAMESPACE }} || {
            echo "Namespace ${{ env.K8S_NAMESPACE }} does not exist"
            exit 1
          }

          # Verify we can create resources
          kubectl auth can-i create deployments -n ${{ env.K8S_NAMESPACE }} || {
            echo "Insufficient permissions to create deployments"
            exit 1
          }

      - name: Determine image tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_REGISTRY=ardenone" >> $GITHUB_OUTPUT

      - name: Apply Kubernetes manifests
        run: |
          # Apply namespace (if needed)
          kubectl apply -f k8s/apexalgo-iad/namespace.yaml

          # Apply RBAC
          kubectl apply -f k8s/apexalgo-iad/rbac.yaml

          # Apply ConfigMap
          kubectl apply -f k8s/apexalgo-iad/configmap.yaml

          # Apply Valkey (Redis for coordination)
          kubectl apply -f k8s/apexalgo-iad/valkey.yaml

          # Wait for Valkey to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=valkey -n ${{ env.K8S_NAMESPACE }} --timeout=120s

          # Update deployment images with new tag
          sed -i.bak "s|docker.io/.*:latest|docker.io/${{ steps.version.outputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}|g" k8s/apexalgo-iad/coordinator.yaml
          sed -i.bak "s|docker.io/.*:latest|docker.io/${{ steps.version.outputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}|g" k8s/apexalgo-iad/runner-hybrid.yaml
          sed -i.bak "s|docker.io/.*:latest|docker.io/${{ steps.version.outputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}|g" k8s/apexalgo-iad/runner-notification.yaml
          sed -i.bak "s|docker.io/.*:latest|docker.io/${{ steps.version.outputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}|g" k8s/apexalgo-iad/runner-exploration.yaml

          # Apply deployments
          kubectl apply -f k8s/apexalgo-iad/coordinator.yaml
          kubectl apply -f k8s/apexalgo-iad/runner-hybrid.yaml
          kubectl apply -f k8s/apexalgo-iad/runner-notification.yaml
          kubectl apply -f k8s/apexalgo-iad/runner-exploration.yaml

          # Apply HPA
          kubectl apply -f k8s/apexalgo-iad/hpa.yaml

          # Apply ServiceMonitor (if Prometheus is available)
          kubectl apply -f k8s/apexalgo-iad/servicemonitor.yaml --ignore-not-found=true

      - name: Wait for deployment rollout
        run: |
          # Wait for coordinator deployment
          kubectl rollout status deployment/coordinator -n ${{ env.K8S_NAMESPACE }} --timeout=300s

          # Wait for runner deployments
          kubectl rollout status deployment/runner-hybrid -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/runner-notification -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/runner-exploration -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Run health checks
        id: health_check
        if: github.event.inputs.skip_health_checks != 'true'
        run: |
          # Wait for pods to be ready
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/part-of=botburrow -n ${{ env.K8S_NAMESPACE }} --timeout=300s

          # Check pod status
          echo "Pod status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

          # Run health endpoint checks
          echo "Checking health endpoints..."

          # Get coordinator pod
          COORDINATOR_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/name=coordinator -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$COORDINATOR_POD" ]; then
            echo "Checking coordinator health..."
            kubectl exec -n ${{ env.K8S_NAMESPACE }} $COORDINATOR_POD -- curl -s http://localhost:9090/health || echo "Coordinator health check failed"
          fi

          # Get runner pod
          RUNNER_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/component=runner -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$RUNNER_POD" ]; then
            echo "Checking runner health..."
            kubectl exec -n ${{ env.K8S_NAMESPACE }} $RUNNER_POD -- curl -s http://localhost:9091/health || echo "Runner health check failed"
          fi

          # Check Valkey connectivity
          echo "Checking Valkey connectivity..."
          VALKEY_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/name=valkey -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.K8S_NAMESPACE }} $VALKEY_POD -- redis-cli ping || {
            echo "Valkey health check failed"
            exit 1
          }

          echo "All health checks passed!"

      - name: Display deployment status
        if: always()
        run: |
          echo "=== Deployment Status ==="
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"
          echo "Cluster: ${{ env.CLUSTER_NAME }}"
          echo ""
          echo "Deployments:"
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Services:"
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "HPA:"
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }} || echo "HPA not found"

      - name: Rollback on failure
        if: failure() && steps.health_check.outcome == 'failure'
        run: |
          echo "Health checks failed, rolling back deployment..."

          # Rollback deployments
          kubectl rollout undo deployment/coordinator -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/runner-hybrid -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/runner-notification -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout undo deployment/runner-exploration -n ${{ env.K8S_NAMESPACE }}

          echo "Rollback completed"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice::Deployment to ${{ env.CLUSTER_NAME }} completed successfully"
          else
            echo "::error::Deployment to ${{ env.CLUSTER_NAME }} failed"
          fi

  # Verify deployment (runs after deploy)
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA_APEXALGO_IAD }}
        run: |
          mkdir -p $(dirname $KUBECONFIG)
          echo "$KUBE_CONFIG_DATA" | base64 -d > $KUBECONFIG
          chmod 600 $KUBECONFIG

      - name: Run verification script
        run: |
          # Check all resources are deployed
          echo "Verifying deployment..."

          # Check deployments
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}

          # Check pods are running
          PODS=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[*].status.phase}')
          echo "Pod phases: $PODS"

          # Check for failed pods
          FAILED_PODS=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} --field-selector=status.phase=Failed -o jsonpath='{.items[*].metadata.name}')
          if [ -n "$FAILED_PODS" ]; then
            echo "::warning::Failed pods detected: $FAILED_PODS"
          fi

          # Check HPA
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }} || echo "HPA not found"

          echo "Verification completed"
