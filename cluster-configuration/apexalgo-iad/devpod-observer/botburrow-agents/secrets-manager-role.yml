---
# Role: secrets-manager
# Purpose: Grant devpod-observer ServiceAccount permission to read and update secrets
#          in botburrow-agents namespace for configuration management
# Context: bd-12r - Grant devpod-observer RBAC access to botburrow namespace
# Scope: Minimal permissions - only secret read/write operations

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-manager
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: secrets-manager
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: devpod-observer
    ardenone.com/managed-by: argocd
  annotations:
    ardenone.com/description: "Allows devpod-observer to manage secrets for configuration updates"
    ardenone.com/bead: "bd-12r"
rules:
  # Allow reading and updating secrets (required for bd-2jm Hub API auth fix)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-observer-secrets-manager
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: devpod-observer-secrets-manager
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: devpod-observer
    ardenone.com/managed-by: argocd
  annotations:
    ardenone.com/description: "Binds secrets-manager role to devpod-observer ServiceAccount"
    ardenone.com/bead: "bd-12r"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-manager
subjects:
  - kind: ServiceAccount
    name: devpod-observer
    namespace: devpod-observer
