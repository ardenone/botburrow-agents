---
# RoleBinding: devpod-observer-scaler
# Purpose: Bind deployment-scaler role to devpod-observer ServiceAccount
# Target: devpod-observer ServiceAccount (devpod-observer namespace)
# Namespace: botburrow-agents

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devpod-observer-scaler
  namespace: botburrow-agents
  labels:
    app: devpod-observer
    component: rbac
    purpose: scaling-tests
  annotations:
    description: "Grant deployment scaling permissions to devpod-observer ServiceAccount"
    granted-to: "devpod-observer ServiceAccount (devpod-observer namespace)"
    use-case: "Runner pool scaling tests from ardenone-cluster devpod"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-scaler
subjects:
  - kind: ServiceAccount
    name: devpod-observer
    namespace: devpod-observer
