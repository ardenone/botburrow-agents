# =============================================================================
# EXAMPLE MANIFEST - DO NOT EDIT FOR DEPLOYMENT
# =============================================================================
#
# This is an EXAMPLE Kubernetes manifest for the botburrow-agents coordinator.
# It is NOT deployed directly from this repository.
#
# DEPLOYMENT:
#   The actual deployment uses manifests in the ardenone-cluster repository:
#   https://github.com/ardenone/ardenone-cluster/tree/main/cluster-configuration/apexalgo-iad/botburrow-agents
#
# CUSTOMIZATION REQUIRED (if deploying to your own cluster):
#   1. Update `image:` to point to your container registry
#   2. Create secrets with keys: HUB_API_KEY, R2_ACCESS_KEY, R2_SECRET_KEY, R2_ENDPOINT
#   3. Update `HUB_URL` in configmap.yaml to point to your Hub instance
#   4. Configure imagePullSecrets if using private registry
#   5. Adjust resource requests/limits for your cluster
#
# ENVIRONMENT VARIABLES:
#   - BOTBURROW_HUB_API_KEY: Mapped from secret HUB_API_KEY (pydantic prefix)
#   - HUB_URL: Hub API endpoint (from configmap)
#   - REDIS_URL: Valkey/Redis connection (from configmap)
#
# RELATED FILES:
#   - configmap.yaml: Application configuration
#   - botburrow-agents-secrets-PLACEHOLDER.yml: Secret template
#   - namespace.yaml: Namespace definition
#   - rbac.yaml: ServiceAccount and permissions
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: botburrow-agents
  annotations:
    # Sync wave 5: Deploy after Valkey
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: botburrow-agents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: botburrow-agents
      imagePullSecrets:
        - name: docker-hub-registry
      terminationGracePeriodSeconds: 30
      # Git clone init container (per ADR-028)
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          env:
            - name: AGENT_DEFINITIONS_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-url
            - name: AGENT_DEFINITIONS_REPO_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          command:
            - sh
            - -c
            - git clone --depth=1 --branch=${AGENT_DEFINITIONS_REPO_BRANCH} ${AGENT_DEFINITIONS_REPO_URL} /configs/agent-definitions
          volumeMounts:
            - name: agent-definitions
              mountPath: /configs
      containers:
        - name: coordinator
          image: docker.io/ronaldraygun/botburrow-agents:latest
          command: ["python", "-m", "botburrow_agents.coordinator.main"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: botburrow-agents-config
            - secretRef:
                name: botburrow-agents-secrets
          env:
            # Map HUB_API_KEY to BOTBURROW_HUB_API_KEY for config.py (pydantic-settings uses BOTBURROW_ prefix)
            - name: BOTBURROW_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: botburrow-agents-secrets
                  key: HUB_API_KEY
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOTBURROW_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Git config path (for local filesystem mode)
            - name: AGENT_DEFINITIONS_PATH
              value: /configs/agent-definitions
            - name: AGENT_DEFINITIONS_REPO
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-name
            - name: AGENT_DEFINITIONS_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: agent-definitions
              mountPath: /configs/agent-definitions
              readOnly: true
      volumes:
        - name: agent-definitions
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: coordinator
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
