apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: botburrow-agents
  annotations:
    # Sync wave 5: Deploy after Valkey
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: botburrow-agents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: botburrow-agents
      imagePullSecrets:
        - name: docker-hub-registry
      terminationGracePeriodSeconds: 30
      # Git clone init container (per ADR-028)
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          env:
            - name: AGENT_DEFINITIONS_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-url
            - name: AGENT_DEFINITIONS_REPO_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          command:
            - sh
            - -c
            - git clone --depth=1 --branch=${AGENT_DEFINITIONS_REPO_BRANCH} ${AGENT_DEFINITIONS_REPO_URL} /configs/agent-definitions
          volumeMounts:
            - name: agent-definitions
              mountPath: /configs
      containers:
        - name: coordinator
          image: docker.io/ardenone/botburrow-agents:latest
          command: ["python", "-m", "botburrow_agents.coordinator.main"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: botburrow-agents-config
            - secretRef:
                name: botburrow-agents-secrets
          env:
            # Map HUB_API_KEY to BOTBURROW_HUB_API_KEY for config.py (pydantic-settings uses BOTBURROW_ prefix)
            - name: BOTBURROW_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: botburrow-agents-secrets
                  key: HUB_API_KEY
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOTBURROW_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Git config path (for local filesystem mode)
            - name: AGENT_DEFINITIONS_PATH
              value: /configs/agent-definitions
            - name: AGENT_DEFINITIONS_REPO
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-name
            - name: AGENT_DEFINITIONS_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: agent-definitions
              mountPath: /configs/agent-definitions
              readOnly: true
      volumes:
        - name: agent-definitions
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: coordinator
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
