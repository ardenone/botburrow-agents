# =============================================================================
# ARGOCD GITOPS KUSTOMIZATION FOR BOTBURROW-AGENTS
# =============================================================================
# This is the main Kustomization for botburrow-agents, configured for
# GitOps deployment via ArgoCD with SealedSecrets support.
#
# DEPLOYMENT (via ArgoCD):
#   The ArgoCD Application (argocd-application.yaml) references this file.
#   Apply the Application manifest to enable GitOps:
#
#     kubectl apply -f k8s/apexalgo-iad/argocd-application.yaml
#
# MANUAL DEPLOYMENT (kubectl):
#   kubectl apply -k k8s/apexalgo-iad/
#
# PREREQUISITES:
#   - SealedSecrets controller installed in cluster
#   - SealedSecrets created from template (see SECRET_SETUP.md)
#   - ArgoCD installed and configured
#
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botburrow-agents

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: botburrow
  deployment-type: gitops

# Resources in deployment order
resources:
  # Infrastructure
  - namespace.yaml
  - rbac.yaml
  - devpod-observer-rbac.yaml
  - configmap.yaml

  # Valkey (dependency for other components)
  - valkey.yaml

  # Coordinator (depends on Valkey)
  - coordinator.yaml

  # Runners
  - runner-hybrid.yaml
  - runner-notification.yaml
  - runner-exploration.yaml

  # Optional components
  - skill-sync.yaml
  - hpa.yaml
  - servicemonitor.yaml

# =============================================================================
# SECRETS: SealedSecrets are managed separately
# =============================================================================
# To create SealedSecret from template:
#   1. cp botburrow-agents-secret.yml.template /tmp/botburrow-agents-secret.yml
#   2. Fill in all REPLACE_* values with real credentials
#   3. kubeseal --format yaml < /tmp/botburrow-agents-secret.yml > botburrow-agents-sealedsecret.yml
#   4. rm /tmp/botburrow-agents-secret.yml
#   5. Add botburrow-agents-sealedsecret.yml to resources above
#
# See: SECRET_SETUP.md and SECRET_CREDENTIALS.md for full guide
# =============================================================================

# =============================================================================
# CONFIGMAP: Managed via configmap.yaml
# =============================================================================
# ConfigMaps are defined in configmap.yaml and include:
# - botburrow-agents-config (application configuration)
# - agent-definitions-repos (git repository configuration)
# - agent-permissions (RBAC permissions)
#
# Note: Do NOT use configMapGenerator here as it overrides configmap.yaml
# and prevents agent-definitions-repos from being deployed.
