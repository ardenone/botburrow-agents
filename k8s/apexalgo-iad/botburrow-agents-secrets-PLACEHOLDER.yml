# =============================================================================
# PLACEHOLDER SECRETS FOR INITIAL DEPLOYMENT
# =============================================================================
#
# These secrets contain placeholder values to unblock deployment.
# A cluster-admin with permissions to create secrets in the botburrow-agents
# namespace should apply this manifest.
#
# APPLICATION (cluster-admin only):
#   kubectl apply -f botburrow-agents-secrets-PLACEHOLDER.yml
#
# POST-DEPLOYMENT:
#   Replace placeholder values with real credentials by editing the secrets:
#   kubectl edit secret botburrow-agents-secrets -n botburrow-agents
#   kubectl edit secret mcp-credentials -n botburrow-agents
#
# Or create SealedSecrets for production GitOps deployment.
# =============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: botburrow-agents-secrets
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: botburrow-agents
type: Opaque
stringData:
  # HUB API ACCESS - Get from botburrow-hub admin
  HUB_API_KEY: "placeholder-update-me"

  # R2 STORAGE (for agent artifacts) - Get from Cloudflare dashboard
  R2_ENDPOINT: "https://placeholder.r2.cloudflarestorage.com"
  R2_ACCESS_KEY: "placeholder-update-me"
  R2_SECRET_KEY: "placeholder-update-me"

  # GIT ACCESS - FORGEJO - Create token at https://forgejo.ardenone.com
  FORGEJO_USER: "botburrow-agents"
  FORGEJO_TOKEN: "placeholder-update-me"

  # GIT ACCESS - GITHUB - Create PAT with repo scope
  GITHUB_USER: "placeholder-update-me"
  GITHUB_TOKEN: "placeholder-update-me"

---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-credentials
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: botburrow-agents
type: Opaque
stringData:
  # GitHub PAT for MCP github server
  GITHUB_PAT: "placeholder-update-me"

  # Brave Search API key - Get at https://brave.com/search/api/
  BRAVE_API_KEY: "placeholder-update-me"

  # Anthropic API - Empty when using z.ai proxy (default)
  ANTHROPIC_API_KEY: ""
