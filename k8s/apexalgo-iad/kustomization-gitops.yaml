# =============================================================================
# ARGOCD GITOPS KUSTOMIZATION FOR BOTBURROW-AGENTS
# =============================================================================
#
# This is the GitOps-ready Kustomization for botburrow-agents. It includes
# all resources needed for a proper ArgoCD deployment with automated
# health checks and SealedSecrets support.
#
# DEPLOYMENT (via ArgoCD):
#   The ArgoCD Application (argocd-application.yaml) references this file.
#   Apply the Application manifest to enable GitOps:
#
#     kubectl apply -f k8s/apexalgo-iad/argocd-application.yaml
#
# MANUAL DEPLOYMENT (kubectl):
#   kubectl apply -k k8s/apexalgo-iad/ --kustomize=kustomization-gitops.yaml
#
# PREREQUISITES:
#   - SealedSecrets controller installed in cluster
#   - SealedSecrets applied: kubectl apply -f botburrow-agents-sealedsecrets.yml
#   - ArgoCD installed and configured
#
# FEATURES:
#   - All core components (valkey, coordinator, runners)
#   - ArgoCD health check hooks (pre-sync validation, post-sync verification)
#   - Sync wave annotations for ordered deployment
#   - HPA for autoscaling
#   - ServiceMonitor for Prometheus metrics
#
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botburrow-agents

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: botburrow
  deployment-type: gitops

# Resources in deployment order (sync waves ensure proper ordering)
resources:
  # Wave 0: Infrastructure (RBAC, ConfigMap)
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml

  # Wave 1: Valkey (dependency for other components)
  - valkey.yaml

  # Wave 5: Coordinator (depends on Valkey)
  - coordinator.yaml

  # Wave 10: Runners (depend on Coordinator)
  - runner-hybrid.yaml
  - runner-notification.yaml
  - runner-exploration.yaml

  # Wave 15: Post-deployment components
  - hpa.yaml
  - servicemonitor.yaml

  # ArgoCD hooks for health checks
  - argocd-health-checks.yaml

# =============================================================================
# CONFIGMAP GENERATOR (with checksum for automatic restarts)
# =============================================================================
# When ConfigMap changes, pods will restart due to checksum annotation
configMapGenerator:
  - name: botburrow-agents-config
    literals:
      - HUB_URL=https://hub.botburrow.internal
      - REDIS_URL=redis://valkey.botburrow-agents.svc.cluster.local:6379
      - R2_BUCKET=agent-artifacts
      - POLL_INTERVAL=30
      - ACTIVATION_TIMEOUT=300
      - MAX_ITERATIONS=10
      - MIN_ACTIVATION_INTERVAL=900
      - LOCK_TTL=600
      - SANDBOX_IMAGE=ghcr.io/botburrow/botburrow-sandbox:latest
      - SANDBOX_MEMORY=2g
      - SANDBOX_CPU=1.0
      - MCP_TIMEOUT=30
      - DEFAULT_EXECUTOR=claude-cli
      - DEFAULT_MODEL=glm-4.7
      - DEFAULT_API_BASE=http://zai-proxy.mcp.svc.cluster.local:8080
      - DEFAULT_TEMPERATURE=0.7
      - DEFAULT_MAX_TOKENS=4096

# =============================================================================
# SECRET REFERENCES (SealedSecrets)
# =============================================================================
# Secrets are managed via SealedSecrets and are NOT generated by Kustomize.
# This ensures they can be safely committed to Git in encrypted form.
#
# Create SealedSecrets from templates:
#   kubeseal --format yaml < botburrow-agents-sealedsecret-templates.yml \
#     > botburrow-agents-sealedsecrets.yml
#   kubectl apply -f botburrow-agents-sealedsecrets.yml
#
# Required secrets:
#   - botburrow-agents-secrets (HUB_API_KEY, R2_*, FORGEJO_*, GITHUB_*)
#   - mcp-credentials (GITHUB_PAT, BRAVE_API_KEY, ANTHROPIC_API_KEY)
# =============================================================================

# =============================================================================
# IMAGES (reference configuration)
# =============================================================================
# Images can be overridden via ArgoCD parameter overrides or by editing
# the deployment manifests directly.
# =============================================================================
images:
  - name: ghcr.io/botburrow/botburrow-agents
    newName: ghcr.io/botburrow/botburrow-agents
    newTag: latest

# =============================================================================
# SYNC WAVES SUMMARY
# =============================================================================
# The following sync waves are applied via annotations in individual manifests:
#
# Wave 0: Infrastructure (RBAC, ConfigMaps)
#   - namespace.yaml (argocd.argoproj.io/sync-wave: "0")
#   - rbac.yaml (argocd.argoproj.io/sync-wave: "0")
#   - configmap.yaml (argocd.argoproj.io/sync-wave: "0")
#
# Wave 1: Dependencies
#   - valkey.yaml (argocd.argoproj.io/sync-wave: "1")
#
# Wave 5: Core Services
#   - coordinator.yaml (argocd.argoproj.io/sync-wave: "5")
#
# Wave 10: Workers
#   - runner-hybrid.yaml (argocd.argoproj.io/sync-wave: "10")
#   - runner-notification.yaml (argocd.argoproj.io/sync-wave: "10")
#   - runner-exploration.yaml (argocd.argoproj.io/sync-wave: "10")
#
# Wave 15: Post-Deployment
#   - hpa.yaml (argocd.argoproj.io/sync-wave: "15")
#   - servicemonitor.yaml (argocd.argoproj.io/sync-wave: "15")
#
# Hooks:
#   - argocd-health-checks.yaml (PreSync: wave 0, PostSync: wave 10)
# =============================================================================
