# =============================================================================
# ArgoCD Application for botburrow-agents
# =============================================================================
#
# This manifest defines the ArgoCD Application for botburrow-agents in the
# apexalgo-iad cluster. It enables GitOps-based deployment with automated
# sync and health checks.
#
# DEPLOYMENT:
#   kubectl apply -f k8s/apexalgo-iad/argocd-application.yaml
#
# PREREQUISITES:
#   - ArgoCD installed in argocd namespace
#   - SealedSecrets created and applied (see botburrow-agents-secrets-templates.yml)
#   - Namespace already exists
#
# FEATURES:
#   - Automated sync from main branch
#   - Prune resources removed from Git
#   - Self-heal on manual drift
#   - Health checks for all resources
#
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: botburrow-agents
  namespace: argocd
  labels:
    app.kubernetes.io/name: botburrow-agents
    app.kubernetes.io/part-of: botburrow
  annotations:
    # Link to source repository
    notifications.argoproj.io/subscribe.slack: ""
spec:
  # Project for application organization
  project: default

  # Source repository configuration
  source:
    # Update this to your fork/organization
    repoURL: https://github.com/ardenone/botburrow-agents.git
    targetRevision: main
    path: k8s/apexalgo-iad

    # Kustomize build options
    kustomize:
      # Use GitOps kustomization for production with health checks
      # For minimal testing, use kustomization-minimal.yaml instead
      # The main kustomization.yaml is now configured for GitOps deployment
      # buildOption: --kustomize=kustomization-gitops.yaml

    # Directory-level options
    directory:
      recurse: false
      jsonnet:
        extVars: []

  # Destination cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: botburrow-agents

  # Sync policy
  syncPolicy:
    # Automated sync on repository changes
    automated:
      # Delete resources removed from Git
      prune: true
      # Reconcile manual changes to resources
      selfHeal: true
      # Allow empty resources (useful for initial sync)
      allowEmpty: false

    # Sync options
    syncOptions:
      # Create namespace if it doesn't exist
      - CreateNamespace=false
      # Prune last (after propagation)
      - PrunePropagationPolicy=foreground
      # Prune from finalizers
      - PruneLast=true
      # Respect server-side dry-run
      - ServerSideApply=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Revision history limit
  revisionHistoryLimit: 10

  # Health checks
  healthCheck:
    # Skip optional resources
    skipValidation: false

---
