# =============================================================================
# EXAMPLE MANIFEST - DO NOT EDIT FOR DEPLOYMENT
# =============================================================================
#
# This is an EXAMPLE Kubernetes manifest for the coordinator with git-sync.
# It is NOT deployed directly from this repository.
#
# DEPLOYMENT:
#   The actual deployment uses manifests in the ardenone-cluster repository:
#   https://github.com/ardenone/ardenone-cluster/tree/main/cluster-configuration/apexalgo-iad/botburrow-agents
#
# GIT-SYNC SIDECAR:
#   Uses git-sync sidecar instead of initContainer for live config updates.
#   Agent definitions are continuously synced from the git repository.
#   Changes take effect without pod restarts.
#
# ALTERNATIVES:
#   - coordinator.yaml: Uses initContainer (simpler, requires restart for updates)
#   - This file: Uses git-sync sidecar (more complex, live updates)
#
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator-git-sync
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: botburrow-agents
    app.kubernetes.io/variant: git-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
      app.kubernetes.io/component: coordinator
      app.kubernetes.io/variant: git-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: botburrow-agents
        app.kubernetes.io/variant: git-sync
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: botburrow-agents
      imagePullSecrets:
        - name: docker-hub-registry
      terminationGracePeriodSeconds: 30

      # git-sync sidecar (replaces initContainer)
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          securityContext:
            runAsUser: 65533  # git-sync user
            runAsGroup: 65533
            fsGroup: 65533
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --repo=$(AGENT_DEFINITIONS_REPO_URL)
            - --branch=$(AGENT_DEFINITIONS_REPO_BRANCH)
            - --depth=1
            - --dest=/git-agent-definitions
            - --wait=60  # Poll every 60 seconds
            - --root=/git
            - --one-time=false  # Continuous sync
          env:
            - name: GITSYNC_LOG
              value: "warn"  # Reduce log noise
            - name: AGENT_DEFINITIONS_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-url
            - name: AGENT_DEFINITIONS_REPO_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
            # Git authentication credentials removed - using public GitHub repository
          volumeMounts:
            - name: agent-definitions
              mountPath: /git
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

        - name: coordinator
          image: docker.io/ronaldraygun/botburrow-agents:latest
          command: ["python", "-m", "botburrow_agents.coordinator.main"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: botburrow-agents-config
            - secretRef:
                name: botburrow-agents-secrets
          env:
            # Map HUB_API_KEY to BOTBURROW_HUB_API_KEY for config.py (pydantic-settings uses BOTBURROW_ prefix)
            - name: BOTBURROW_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: botburrow-agents-secrets
                  key: HUB_API_KEY
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOTBURROW_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Git config path (points to git-sync sidecar output)
            - name: AGENT_DEFINITIONS_PATH
              value: /git/agent-definitions
            - name: AGENT_DEFINITIONS_REPO
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-name
            - name: AGENT_DEFINITIONS_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
            # Notify coordinator when configs are updated
            - name: GIT_SYNC_REFRESH
              value: "60"  # Same as git-sync wait interval
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: agent-definitions
              mountPath: /git
              readOnly: true

      volumes:
        - name: agent-definitions
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-git-sync
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/variant: git-sync
spec:
  selector:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/variant: git-sync
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
