# =============================================================================
# EXAMPLE MANIFEST - DO NOT EDIT FOR DEPLOYMENT
# =============================================================================
#
# This is an EXAMPLE Kubernetes manifest for the botburrow-agents exploration runner.
# It is NOT deployed directly from this repository.
#
# DEPLOYMENT:
#   The actual deployment uses manifests in the ardenone-cluster repository:
#   https://github.com/ardenone/ardenone-cluster/tree/main/cluster-configuration/apexalgo-iad/botburrow-agents
#
# RUNNER MODE: exploration
#   Only discovers new content to engage with (no inbox processing).
#   Use for agents that proactively find and respond to content.
#
# CUSTOMIZATION REQUIRED (if deploying to your own cluster):
#   1. Update `image:` to point to your container registry
#   2. Ensure secrets exist: HUB_API_KEY, R2_*, GITHUB_TOKEN, MCP credentials
#   3. Configure workspace volume size (default 5Gi)
#   4. Typically 1 replica to avoid duplicate discoveries
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-exploration
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: runner-exploration
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: botburrow-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-exploration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-exploration
        app.kubernetes.io/component: runner
        runner-mode: exploration
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: botburrow-agents
      imagePullSecrets:
        - name: docker-hub-registry
      terminationGracePeriodSeconds: 120
      # Git clone init container (per ADR-028)
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          env:
            - name: AGENT_DEFINITIONS_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-url
            - name: AGENT_DEFINITIONS_REPO_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          command:
            - sh
            - -c
            - git clone --depth=1 --branch=${AGENT_DEFINITIONS_REPO_BRANCH} ${AGENT_DEFINITIONS_REPO_URL} /configs/agent-definitions
          volumeMounts:
            - name: agent-definitions
              mountPath: /configs
      containers:
        - name: runner
          image: docker.io/ronaldraygun/botburrow-agents:latest
          command: ["python", "-m", "botburrow_agents.runner.main", "--mode", "exploration"]
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            # Map HUB_API_KEY to BOTBURROW_HUB_API_KEY for config.py (pydantic-settings uses BOTBURROW_ prefix)
            - name: BOTBURROW_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: botburrow-agents-secrets
                  key: HUB_API_KEY
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOTBURROW_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BOTBURROW_RUNNER_MODE
              value: "exploration"
            # Git config path (for local filesystem mode per ADR-028)
            - name: AGENT_DEFINITIONS_PATH
              value: /configs/agent-definitions
            - name: AGENT_DEFINITIONS_REPO
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-name
            - name: AGENT_DEFINITIONS_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: agent-definitions-repos
                  key: repo-branch
          envFrom:
            - configMapRef:
                name: botburrow-agents-config
            - secretRef:
                name: botburrow-agents-secrets
            - secretRef:
                name: mcp-credentials
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /workspaces
            - name: agent-definitions
              mountPath: /configs/agent-definitions
              readOnly: true
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
        - name: agent-definitions
          emptyDir:
            sizeLimit: 100Mi
