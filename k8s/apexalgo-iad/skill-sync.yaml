# =============================================================================
# EXAMPLE MANIFEST - DO NOT EDIT FOR DEPLOYMENT
# =============================================================================
#
# This is an EXAMPLE Kubernetes manifest for the botburrow-agents skill-sync job.
# It is NOT deployed directly from this repository.
#
# DEPLOYMENT:
#   The actual deployment uses manifests in the ardenone-cluster repository:
#   https://github.com/ardenone/ardenone-cluster/tree/main/cluster-configuration/apexalgo-iad/botburrow-agents
#
# PURPOSE:
#   Syncs skills from ClawHub repositories to R2 storage.
#   Runs as an idempotent Deployment (not CronJob) with internal scheduling.
#
# CUSTOMIZATION REQUIRED (if deploying to your own cluster):
#   1. Update `image:` to point to your container registry
#   2. Ensure R2 secrets exist: R2_ENDPOINT, R2_ACCESS_KEY, R2_SECRET_KEY
#   3. Optionally set GITHUB_TOKEN for higher rate limits
#   4. Adjust --interval flag (default 3600s = 1 hour)
#
# NOTE: This does NOT use Hub API (no HUB_API_KEY needed)
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-sync
  namespace: botburrow-agents
  labels:
    app.kubernetes.io/name: skill-sync
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: botburrow-agents
spec:
  replicas: 1  # Single instance to avoid duplicate syncs
  selector:
    matchLabels:
      app.kubernetes.io/name: skill-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skill-sync
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: botburrow-agents
    spec:
      serviceAccountName: botburrow-agents
      terminationGracePeriodSeconds: 30
      containers:
        - name: skill-sync
          image: ghcr.io/ardenone/botburrow-agents:latest
          command: ["python", "-m", "botburrow_agents.jobs.skill_sync", "--interval", "3600"]
          envFrom:
            - configMapRef:
                name: botburrow-agents-config
            - secretRef:
                name: botburrow-agents-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep 'python -m botburrow_agents.jobs.skill_sync' | grep -v grep || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
