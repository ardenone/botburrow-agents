apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: botburrow-agents

commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: botburrow

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml

# =============================================================================
# SECRETS: Add SealedSecret here after creating it
# =============================================================================
# To create SealedSecret from template:
#   1. Use the helper: k8s/apexalgo-iad/scripts/create-sealedsecret.sh
#   2. Or manually (see docs/GITOPS_DEPLOYMENT.md § Secrets Management):
#      - cp botburrow-agents-secret.yml.template /tmp/botburrow-agents-secret.yml
#      - Fill in all REPLACE_* values with real credentials
#      - kubeseal --format yaml \
#          --controller-namespace=sealed-secrets \
#          --controller-name=sealed-secrets-apexalgo-iad \
#          < /tmp/botburrow-agents-secret.yml > botburrow-agents-sealedsecrets.yml
#      - rm /tmp/botburrow-agents-secret.yml
#   3. Uncomment the line below and commit — ArgoCD syncs it; never kubectl apply by hand
# See: SECRET_SETUP.md and SECRET_CREDENTIALS.md for full guide
# =============================================================================
#  - botburrow-agents-sealedsecrets.yml  # <-- UNCOMMENT after creating SealedSecret

  - valkey.yaml
  - coordinator.yaml
  - runner-hybrid.yaml
  - runner-notification.yaml
  - runner-exploration.yaml
  - skill-sync.yaml
  - hpa.yaml
  - servicemonitor.yaml

# Optional: Use git-sync sidecars for live config updates
# To enable git-sync variants (live config updates without restarts):
# 1. Replace coordinator.yaml with coordinator-git-sync.yaml
# 2. Replace runner-*yaml with runner-git-sync.yaml
# The git-sync variants poll the agent-definitions repo every 60s
# and update the mounted configs automatically.
